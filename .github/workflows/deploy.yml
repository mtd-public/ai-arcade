name: Deploy to GitHub Pages

# Builds and publishes the site on every push to main. Pull requests get the
# checks without deploying.
#
# One-time setup: Settings > Pages > Build and deployment > Source: GitHub Actions.
#
# The site address comes from GitHub Pages itself (actions/configure-pages), so
# the build targets https://<owner>.github.io/<repo>/ until you add a custom
# domain in Settings > Pages, and https://your-domain/ after that. Re-run this
# workflow once after changing the domain. See docs/CUSTOM-DOMAIN.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # No npm install: the build has no dependencies.
      - name: Check links and pages
        run: npm run check

      - name: Read the Pages address
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'https://example.github.io/ai-arcade' }}

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
